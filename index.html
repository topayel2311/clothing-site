<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Four Sections</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" id="top">
    <button id="menuBtn" class="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#" id="contactLink">Contact</a>
    </nav>
    <div class="menu-panel" id="menuPanel">
      <div class="item-view" id="itemView">
        <p class="item-view-text">Click an item</p>
      </div>
      <div class="menu-body">
        <button type="button" class="item-btn" data-item="shirt">
          <span class="item-name">Shirt</span>
        </button>
        <button type="button" class="item-btn" data-item="tshirt">
          <span class="item-name">T-Shirt</span>
        </button>
        <button type="button" class="item-btn" data-item="polo">
          <span class="item-name">Polo T-Shirt</span>
        </button>
        <button type="button" class="item-btn" data-item="pant">
          <span class="item-name">Pant</span>
        </button>
      </div>
    </div>
  </header>
  <section class="banner">
    <h2>Welcome</h2>
    <p>Learn, track marks, and share results in one place.</p>
    <button id="bannerBtn" type="button">Get Started</button>
    <p id="contactInfo" class="contact-info">My number: 01647634546</p>
  </section>
  <div class="container">
    <div class="section div1"><span class="label">Shirt</span><input class="field" data-key="shirt" placeholder="Shirt" /></div>
    <div class="section div2"><span class="label">T-Shirt</span><input class="field" data-key="tshirt" placeholder="T-Shirt" /></div>
    <div class="section div3"><span class="label">Polo T-Shirt</span><input class="field" data-key="polo" placeholder="Polo T-Shirt" /></div>
    <div class="section div4"><span class="label">Pant</span><input class="field" data-key="pant" placeholder="Pant" /></div>
  </div>
  <div class="upload-box">
    <h2>Upload PNG</h2>
    <input type="file" id="pngInput" accept="image/png" />
    <img id="preview" class="preview" alt="Preview" />
    <p id="status" class="status"></p>
  </div>
  <div class="animal-row">
    <div class="new-div cat-box" id="tshirt">
      <svg class="cat" viewBox="0 0 100 100" role="img" aria-label="T-Shirt">
        <path d="M35 22 L20 30 L14 45 L28 52 L28 88 L72 88 L72 52 L86 45 L80 30 L65 22 Q50 32 35 22 Z" fill="#2e86de" />
        <path d="M35 22 Q50 34 65 22" stroke="#1a5276" stroke-width="3" fill="none" />
      </svg>
    </div>
    <div class="animal-stack">
      <div class="new-div dog-box" id="shirt">
        <svg class="cat" viewBox="0 0 100 100" role="img" aria-label="Shirt">
          <path d="M36 20 L22 26 L16 42 L29 48 L29 90 L71 90 L71 48 L84 42 L78 26 L64 20 L50 34 Z" fill="#27ae60" />
          <path d="M50 34 L50 90" stroke="#1e8449" stroke-width="3" />
          <rect x="40" y="40" width="20" height="4" fill="#1e8449" />
          <rect x="40" y="60" width="20" height="4" fill="#1e8449" />
        </svg>
      </div>
      <div class="new-div tiger-box" id="polo">
        <svg class="cat" viewBox="0 0 100 100" role="img" aria-label="Polo Shirt">
          <path d="M35 20 L20 28 L15 44 L28 50 L28 90 L72 90 L72 50 L85 44 L80 28 L65 20 L50 32 Z" fill="#8e44ad" />
          <path d="M40 20 L50 34 L60 20 Z" fill="#6c3483" />
          <rect x="46" y="34" width="8" height="4" fill="#f1c40f" />
          <rect x="47" y="48" width="6" height="3" fill="#f1c40f" />
          <rect x="47" y="60" width="6" height="3" fill="#f1c40f" />
        </svg>
      </div>
    </div>
    <div class="new-div blank-box" id="pant">
      <svg class="cat" viewBox="0 0 100 100" role="img" aria-label="Pant">
        <path d="M32 14 L68 14 L70 46 L66 90 L54 90 L50 56 L46 90 L34 90 L30 46 Z" fill="#34495e" />
        <path d="M32 14 L68 14 L69 30 L31 30 Z" fill="#2c3e50" />
        <path d="M50 30 L50 52" stroke="#2c3e50" stroke-width="2" />
      </svg>
    </div>
  </div>
  <div class="actions">
    <button id="saveBtn" type="button">Save</button>
    <button id="clearBtn" type="button" class="secondary">Clear</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
